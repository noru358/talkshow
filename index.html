<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>법령 암기집</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', sans-serif; background: #fff; color: #111; }
  #app { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

  .screen { display: none; }
  .screen.active { display: block; }

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: #fff;
    border-bottom: 1px solid #e8e8e8;
    padding: 13px 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .topbar-title { font-size: 16px; font-weight: 600; flex: 1; }
  .back-btn {
    background: none; border: none; cursor: pointer;
    font-size: 22px; color: #555; padding: 0 4px; line-height: 1;
  }

  .search-wrap { padding: 12px 16px; background: #f8f8f8; border-bottom: 1px solid #e8e8e8; }
  .search-wrap input {
    width: 100%; padding: 9px 14px; font-size: 14px;
    border: 1px solid #ddd; border-radius: 10px;
    background: #fff; color: #111; outline: none;
  }
  .search-wrap input:focus { border-color: #1a73e8; }

  .law-group { padding: 0 16px 40px; }
  .group-label {
    font-size: 11px; font-weight: 600; color: #888;
    letter-spacing: 0.6px; padding: 18px 0 6px;
    text-transform: uppercase;
  }
  .law-item {
    display: flex; align-items: center;
    padding: 13px 0; border-bottom: 1px solid #f0f0f0;
    cursor: pointer; transition: background 0.1s;
  }
  .law-item:active { background: #f5f5f5; margin: 0 -16px; padding: 13px 16px; }
  .law-name { font-size: 14px; flex: 1; line-height: 1.4; }
  .law-badge {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    margin-left: 8px; font-weight: 600; white-space: nowrap;
  }
  .badge-법 { background: #e8f0fe; color: #1a56db; }
  .badge-령 { background: #e6f4ea; color: #1e8a3e; }
  .badge-규칙 { background: #fef3e2; color: #b45309; }
  .law-arrow { color: #ccc; font-size: 18px; margin-left: 6px; }

  .toc-list { padding: 0 16px 60px; }
  .toc-item {
    padding: 11px 0 11px 4px; border-bottom: 1px solid #f0f0f0;
    cursor: pointer; font-size: 14px; display: flex; align-items: flex-start; gap: 10px;
  }
  .toc-item:active { background: #f5f5f5; margin: 0 -16px; padding-left: 20px; padding-right: 16px; }
  .toc-art-num { color: #888; min-width: 58px; font-size: 12px; padding-top: 2px; flex-shrink: 0; }

  .article-wrap { padding-bottom: 80px; }
  .article-content { padding: 18px 16px; }
  .art-num { font-size: 12px; color: #888; margin-bottom: 4px; }
  .art-title { font-size: 18px; font-weight: 600; line-height: 1.4; margin-bottom: 18px; }
  .art-body { font-size: 15px; line-height: 2; color: #222; }
  .art-body .item { display: block; margin-bottom: 4px; }
  .art-body .sub-item { display: block; margin-left: 16px; margin-bottom: 2px; }

  .art-nav {
    display: flex; gap: 8px; padding: 12px 16px;
    position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
    background: rgba(255,255,255,0.95); border-top: 1px solid #e8e8e8;
    backdrop-filter: blur(8px);
  }
  .art-nav button {
    flex: 1; padding: 10px; font-size: 14px;
    border: 1px solid #ddd; border-radius: 10px;
    background: #fff; color: #111; cursor: pointer; font-weight: 500;
  }
  .art-nav button:disabled { color: #ccc; cursor: default; }
  .art-nav button:not(:disabled):active { background: #f0f0f0; }

  .law-link { color: #1a73e8; text-decoration: underline; cursor: pointer; text-decoration-color: #93c5fd; }

  .breadcrumb {
    padding: 8px 16px 4px; font-size: 12px; color: #888;
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    border-bottom: 1px solid #f0f0f0;
  }
  .breadcrumb .bc-link { cursor: pointer; color: #1a73e8; }
  .breadcrumb .bc-sep { color: #ccc; }

  .loading-msg { text-align: center; padding: 48px 16px; font-size: 14px; color: #888; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid #ddd; border-top-color: #1a73e8; border-radius: 50%; animation: spin 0.7s linear infinite; margin-bottom: 10px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    margin: 16px; padding: 14px; border-radius: 10px;
    background: #fff3cd; border: 1px solid #ffc107; font-size: 13px; line-height: 1.6;
  }
  .error-box strong { display: block; margin-bottom: 4px; color: #333; }

  .chapter-header {
    font-size: 13px; font-weight: 600; color: #444;
    padding: 14px 0 4px; border-bottom: none;
  }
</style>
</head>
<body>
<div id="app">
  <div id="screen-home" class="screen active">
    <div class="topbar">
      <span class="topbar-title">⚖️ 법령 암기집</span>
    </div>
    <div class="search-wrap">
      <input type="search" id="search-input" placeholder="법령명 검색..." oninput="filterLaws(this.value)">
    </div>
    <div class="law-group" id="law-list"></div>
  </div>

  <div id="screen-toc" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="goHome()">‹</button>
      <span class="topbar-title" id="toc-law-name"></span>
    </div>
    <div class="breadcrumb" id="toc-breadcrumb"></div>
    <div class="toc-list" id="toc-list"></div>
  </div>

  <div id="screen-article" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="goToc()">‹</button>
      <span class="topbar-title" id="art-law-name"></span>
    </div>
    <div class="breadcrumb" id="art-breadcrumb"></div>
    <div class="article-wrap" id="article-body"></div>
    <div class="art-nav">
      <button id="btn-prev" onclick="navArticle(-1)">← 이전 조</button>
      <button id="btn-next" onclick="navArticle(1)">다음 조 →</button>
    </div>
  </div>
</div>

<script>
const OC = 'noruking123';
const BASE = 'https://www.law.go.kr/DRF';

const LAWS = [
  { group:'감정평가', short:'감정평가법', type:'법', query:'감정평가 및 감정평가사에 관한 법률' },
  { group:'감정평가', short:'감정평가법 시행령', type:'령', query:'감정평가 및 감정평가사에 관한 법률 시행령' },
  { group:'감정평가', short:'감정평가법 시행규칙', type:'규칙', query:'감정평가 및 감정평가사에 관한 법률 시행규칙' },
  { group:'감정평가', short:'감정평가에 관한 규칙', type:'규칙', query:'감정평가에 관한 규칙' },
  { group:'부동산공시', short:'부동산공시법', type:'법', query:'부동산 가격공시에 관한 법률' },
  { group:'부동산공시', short:'부동산공시법 시행령', type:'령', query:'부동산 가격공시에 관한 법률 시행령' },
  { group:'토지보상', short:'토지보상법', type:'법', query:'공익사업을 위한 토지 등의 취득 및 보상에 관한 법률' },
  { group:'토지보상', short:'토지보상법 시행령', type:'령', query:'공익사업을 위한 토지 등의 취득 및 보상에 관한 법률 시행령' },
  { group:'토지보상', short:'토지보상법 시행규칙', type:'규칙', query:'공익사업을 위한 토지 등의 취득 및 보상에 관한 법률 시행규칙' },
  { group:'도시정비', short:'도시정비법', type:'법', query:'도시 및 주거환경정비법' },
  { group:'도시정비', short:'도시정비법 시행령', type:'령', query:'도시 및 주거환경정비법 시행령' },
  { group:'도시정비', short:'도시정비법 시행규칙', type:'규칙', query:'도시 및 주거환경정비법 시행규칙' },
  { group:'행정', short:'행정소송법', type:'법', query:'행정소송법' },
  { group:'행정', short:'행정기본법', type:'법', query:'행정기본법' },
  { group:'행정', short:'행정대집행법', type:'법', query:'행정대집행법' },
  { group:'행정', short:'행정절차법', type:'법', query:'행정절차법' },
  { group:'행정', short:'행정심판법', type:'법', query:'행정심판법' },
];

let currentLawIdx = null;
let currentArticles = [];
let currentArticleIdx = 0;
const lawCache = {};

function renderLawList(laws) {
  const groups = {};
  laws.forEach(l => { if (!groups[l.group]) groups[l.group] = []; groups[l.group].push(l); });
  document.getElementById('law-list').innerHTML = Object.entries(groups).map(([g, items]) => `
    <div class="group-label">${g}</div>
    ${items.map(l => `
      <div class="law-item" onclick="openLaw(${LAWS.indexOf(l)})">
        <span class="law-name">${l.short}</span>
        <span class="law-badge badge-${l.type}">${l.type}</span>
        <span class="law-arrow">›</span>
      </div>
    `).join('')}
  `).join('');
}

function filterLaws(q) {
  const f = q.trim();
  renderLawList(f ? LAWS.filter(l => l.short.includes(f) || l.query.includes(f)) : LAWS);
}

async function openLaw(idx) {
  currentLawIdx = idx;
  const law = LAWS[idx];
  document.getElementById('toc-law-name').textContent = law.short;
  document.getElementById('toc-breadcrumb').innerHTML = `<span>${law.short}</span>`;
  showScreen('toc');

  if (lawCache[idx]) { renderToc(lawCache[idx]); return; }

  document.getElementById('toc-list').innerHTML = `<div class="loading-msg"><div class="spinner"></div><br>${law.short} 불러오는 중...</div>`;

  try {
    const searchUrl = `${BASE}/lawSearch.do?OC=${OC}&target=law&type=JSON&query=${encodeURIComponent(law.query)}&display=5&page=1`;
    const res = await fetch(searchUrl);
    const data = await res.json();
    const laws = data?.LawSearch?.law;
    if (!laws) throw new Error('검색 결과가 없습니다');
    const found = Array.isArray(laws) ? laws[0] : laws;
    const mst = found.MST || found.lsiSeq;
    if (!mst) throw new Error('법령 식별자를 찾을 수 없습니다');
    await loadDetail(idx, mst);
  } catch(e) {
    showError(e.message);
  }
}

async function loadDetail(idx, mst) {
  try {
    const url = `${BASE}/lawService.do?OC=${OC}&target=law&MST=${mst}&type=JSON`;
    const res = await fetch(url);
    const data = await res.json();
    const articles = parseArticles(data);
    lawCache[idx] = articles;
    renderToc(articles);
  } catch(e) {
    showError(e.message);
  }
}

function parseArticles(data) {
  const articles = [];
  const body = data?.law?.lawBody || data?.Law?.lawBody || data?.법령?.조문 || null;
  if (!body) return articles;

  const jos = body.jo || body.Jo || [];
  const joArr = Array.isArray(jos) ? jos : (jos ? [jos] : []);

  joArr.forEach(jo => {
    const num = jo['@_조번호'] || jo.joNum || jo['@joNum'] || '';
    const title = jo['@_조제목'] || jo.joTitle || jo['@joTitle'] || '';
    const cont = extractContent(jo);
    articles.push({ num, title, content: cont });
  });
  return articles;
}

function extractContent(jo) {
  let parts = [];
  const addText = (t) => { if (t && t.trim()) parts.push(t.trim()); };

  const cont = jo.joCont || jo['@joCont'] || jo['조문내용'] || '';
  if (typeof cont === 'string') addText(cont);
  else if (cont?.['#text']) addText(cont['#text']);

  const items = jo.항 || jo.ho || jo.item || [];
  const itemArr = Array.isArray(items) ? items : (items ? [items] : []);
  itemArr.forEach(item => {
    const t = item['#text'] || item.content || item['항내용'] || '';
    if (t) addText(t);
    const subs = item.호 || item.subItem || [];
    const subArr = Array.isArray(subs) ? subs : (subs ? [subs] : []);
    subArr.forEach(s => {
      const st = s['#text'] || s.content || '';
      if (st) parts.push('  ' + st.trim());
    });
  });

  return parts.join('\n');
}

function renderToc(articles) {
  currentArticles = articles;
  if (!articles.length) {
    document.getElementById('toc-list').innerHTML = '<div class="loading-msg">조문 데이터를 파싱할 수 없습니다<br><small>API 응답 구조가 다를 수 있습니다</small></div>';
    return;
  }
  document.getElementById('toc-list').innerHTML = articles.map((a, i) => `
    <div class="toc-item" onclick="openArticle(${i})">
      <span class="toc-art-num">제${a.num}조</span>
      <span>${a.title || '(제목 없음)'}</span>
    </div>
  `).join('');
}

function openArticle(idx) {
  currentArticleIdx = idx;
  renderArticle(idx);
  showScreen('article');
  window.scrollTo(0, 0);
}

function renderArticle(idx) {
  const a = currentArticles[idx];
  if (!a) return;
  const law = LAWS[currentLawIdx];
  document.getElementById('art-law-name').textContent = law.short;
  document.getElementById('art-breadcrumb').innerHTML =
    `<span class="bc-link" onclick="goToc()">${law.short}</span><span class="bc-sep">›</span><span>제${a.num}조</span>`;

  const body = linkify(a.content || '조문 내용 없음');
  document.getElementById('article-body').innerHTML = `
    <div class="article-content">
      <div class="art-num">제${a.num}조</div>
      <div class="art-title">${a.title || ''}</div>
      <div class="art-body">${body}</div>
    </div>
  `;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === currentArticles.length - 1;
}

function linkify(text) {
  let t = text.replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  t = t.replace(/\n/g, '<br>');

  // 같은 법 내 조문 링크
  t = t.replace(/제(\d+)조(?:의(\d+))?/g, (m, n, n2) => {
    const full = n2 ? `${n}-${n2}` : n;
    const found = currentArticles.findIndex(a => a.num === full || a.num === n);
    if (found >= 0 && found !== currentArticleIdx) {
      return `<span class="law-link" onclick="openArticle(${found})">${m}</span>`;
    }
    return m;
  });

  // 타 법령 링크
  LAWS.forEach((l, i) => {
    if (i === currentLawIdx) return;
    const re = new RegExp(l.short.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'g');
    t = t.replace(re, `<span class="law-link" onclick="openLaw(${i})">${l.short}</span>`);
  });

  return t;
}

function navArticle(dir) {
  const next = currentArticleIdx + dir;
  if (next < 0 || next >= currentArticles.length) return;
  currentArticleIdx = next;
  renderArticle(next);
  window.scrollTo(0, 0);
}

function showError(msg) {
  document.getElementById('toc-list').innerHTML = `
    <div class="error-box">
      <strong>불러오기 실패</strong>
      ${msg}<br><br>
      <strong>해결 방법</strong>
      이 파일을 GitHub Pages에 업로드하면 정상 작동합니다.<br>
      로컬에서 직접 열면 CORS 정책으로 API 호출이 차단됩니다.
    </div>`;
}

function goHome() { showScreen('home'); }
function goToc() { showScreen('toc'); }

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(`screen-${name}`).classList.add('active');
}

renderLawList(LAWS);
</script>
</body>
</html>
